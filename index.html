<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARCHIVVM NOMINVM · Tabularium Gentium Romanarum</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --farbe-hintergrund-tief: #0a0b0d;
      --farbe-hintergrund-stein: #131519;
      --farbe-karte: #1a1c22;
      --farbe-trennlinie: #2d3039;
      --farbe-gold-haupt: #d4af37;
      --farbe-gold-hell: #fae8a8;
      --farbe-gold-dunkel: #7a6324;

      /* Gesellschaftlicher Stand - Farbleitsystem */
      --stand-patrizier-hg: rgba(139, 38, 62, 0.28);
      --stand-patrizier-linie: #8b263e;
      --stand-patrizier-text: #f3a8b9;

      --stand-ritter-hg: rgba(197, 134, 43, 0.28);
      --stand-ritter-linie: #c5862b;
      --stand-ritter-text: #f5d08f;

      --stand-plebejer-hg: rgba(163, 83, 36, 0.28);
      --stand-plebejer-linie: #a35324;
      --stand-plebejer-text: #f5b793;

      --stand-freigelassener-hg: rgba(90, 80, 115, 0.28);
      --stand-freigelassener-linie: #685b85;
      --stand-freigelassener-text: #c8bee0;

      --stand-provinzial-hg: rgba(56, 102, 85, 0.28);
      --stand-provinzial-linie: #386655;
      --stand-provinzial-text: #9ed6c1;

      /* Tribus - Farbleitsystem */
      --tribus-rustica-hg: rgba(32, 77, 59, 0.35);
      --tribus-rustica-linie: #2e7557;
      --tribus-rustica-text: #96e0bf;

      --tribus-urbana-hg: rgba(104, 65, 40, 0.35);
      --tribus-urbana-linie: #8c5736;
      --tribus-urbana-text: #e2ba9f;

      --text-marmor: #f7f3eb;
      --text-gedaempft: #9b9588;
      --meissel-schatten: 0 1px 0 rgba(255,255,255,0.1), 0 -1px 0 rgba(0,0,0,0.95);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: radial-gradient(circle at 50% 8%, #1c1e24 0%, #08080a 100%);
      color: var(--text-marmor);
      font-family: 'Inter', system-ui, sans-serif;
      min-height: 100vh;
      padding: 2rem 1.25rem 4rem;
      line-height: 1.5;
    }

    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 4px;
      background: linear-gradient(90deg, #8b263e, #d4af37, #c5862b, #2e7557, #8b263e);
      z-index: 1000;
    }

    .haupt-rahmen {
      max-width: 1480px;
      margin: 0 auto;
    }

    /* HEADER */
    header {
      text-align: center;
      padding: 1.5rem 1rem 2.5rem;
      border-bottom: 1px solid var(--farbe-gold-dunkel);
      margin-bottom: 2.5rem;
    }

    .spqr-banderole {
      font-family: 'Cinzel', serif;
      font-size: 0.85rem;
      letter-spacing: 0.4em;
      color: var(--farbe-gold-haupt);
      text-transform: uppercase;
      margin-bottom: 0.6rem;
      display: inline-flex;
      align-items: center;
      gap: 0.8rem;
    }

    .spqr-banderole::before, .spqr-banderole::after {
      content: "❖";
      color: var(--stand-patrizier-linie);
    }

    h1 {
      font-family: 'Cinzel', serif;
      font-size: clamp(2rem, 4.5vw, 3.4rem);
      font-weight: 900;
      letter-spacing: 0.12em;
      color: #fff;
      text-shadow: 0 4px 20px rgba(0,0,0,0.9), 0 0 35px rgba(212,175,55,0.25);
    }

    .untertitel {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.35rem;
      font-style: italic;
      color: var(--text-gedaempft);
      margin-top: 0.4rem;
    }

    /* HAUPTLAYOUT */
    .register-anordnung {
      display: grid;
      grid-template-columns: 410px 1fr;
      gap: 2.2rem;
      align-items: start;
    }

    @media (max-width: 1100px) {
      .register-anordnung { grid-template-columns: 1fr; }
    }

    /* KONTROLLDECK */
    .steuerpult {
      background: var(--farbe-hintergrund-stein);
      border: 1px solid var(--farbe-gold-dunkel);
      box-shadow: 0 15px 35px rgba(0,0,0,0.7), inset 0 0 50px rgba(0,0,0,0.5);
      border-radius: 4px;
      padding: 1.8rem;
      position: sticky;
      top: 1.5rem;
    }

    .steuerpult-titel {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: 'Cinzel', serif;
      font-size: 1.05rem;
      letter-spacing: 0.12em;
      color: var(--farbe-gold-haupt);
      padding-bottom: 0.75rem;
      border-bottom: 1px solid var(--farbe-trennlinie);
      margin-bottom: 1.3rem;
    }

    .eingabe-gruppe {
      margin-bottom: 1.15rem;
    }

    label {
      display: flex;
      justify-content: space-between;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--farbe-gold-hell);
      margin-bottom: 0.35rem;
    }

    .label-untertitel {
      font-size: 0.68rem;
      color: var(--text-gedaempft);
      font-style: italic;
      text-transform: none;
      font-weight: 400;
    }

    select, input[type="text"], input[type="number"] {
      width: 100%;
      background: #0b0c0f;
      border: 1px solid #323640;
      color: var(--text-marmor);
      padding: 0.65rem 0.85rem;
      font-size: 0.88rem;
      border-radius: 3px;
      font-family: inherit;
      transition: all 0.2s;
    }

    select:focus, input:focus {
      outline: none;
      border-color: var(--farbe-gold-haupt);
      box-shadow: 0 0 10px rgba(212,175,55,0.25);
    }

    .auswahl-schalter-zwei {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.5rem;
    }

    .schalter-feld {
      position: relative;
    }

    .schalter-feld input {
      position: absolute;
      opacity: 0;
    }

    .schalter-feld label {
      display: block;
      text-align: center;
      padding: 0.6rem;
      background: #0d0e12;
      border: 1px solid #323640;
      border-radius: 3px;
      cursor: pointer;
      color: var(--text-gedaempft);
      font-size: 0.78rem;
      margin: 0;
      transition: all 0.2s;
    }

    .schalter-feld input:checked + label {
      background: #2b1118;
      border-color: var(--farbe-gold-haupt);
      color: #fff;
      font-weight: 700;
    }

    .haupt-befehl-taste {
      width: 100%;
      background: linear-gradient(180deg, #8b263e 0%, #4a1320 100%);
      color: #fff;
      font-family: 'Cinzel', serif;
      font-weight: 700;
      font-size: 0.95rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      padding: 0.95rem;
      border: 1px solid var(--farbe-gold-haupt);
      border-radius: 3px;
      cursor: pointer;
      box-shadow: 0 5px 18px rgba(0,0,0,0.6);
      margin-top: 1rem;
      transition: all 0.2s;
    }

    .haupt-befehl-taste:hover {
      background: linear-gradient(180deg, #a82e4a 0%, #5d1728 100%);
      border-color: #fff;
      transform: translateY(-1px);
    }

    .steuer-nebentasten {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.5rem;
      margin-top: 0.75rem;
    }

    .neben-taste {
      background: #101216;
      border: 1px solid #2e323b;
      color: var(--text-gedaempft);
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 0.5rem;
      border-radius: 2px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .neben-taste:hover {
      background: #1c1f26;
      color: var(--text-marmor);
      border-color: var(--farbe-gold-dunkel);
    }

    .lexikon-oeffnen-taste {
      width: 100%;
      background: #151a24;
      border: 1px dashed var(--farbe-gold-dunkel);
      color: var(--farbe-gold-hell);
      font-family: 'Cinzel', serif;
      font-size: 0.78rem;
      letter-spacing: 0.1em;
      padding: 0.75rem;
      margin-top: 1.25rem;
      border-radius: 3px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .lexikon-oeffnen-taste:hover {
      background: #1e2533;
      border-color: var(--farbe-gold-haupt);
    }

    /* ERGEBNISFLÄCHE */
    .ausgabe-bereich {
      display: flex;
      flex-direction: column;
      gap: 1.8rem;
    }

    .ausgabe-kopfleiste {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      padding-bottom: 0.8rem;
      border-bottom: 1px solid var(--farbe-trennlinie);
    }

    .zensus-status-text {
      font-family: 'Cinzel', serif;
      font-size: 1rem;
      letter-spacing: 0.06em;
      color: var(--farbe-gold-hell);
    }

    .export-schaltflaechen {
      display: flex;
      gap: 0.5rem;
    }

    .datei-export-taste {
      background: transparent;
      border: 1px solid #444038;
      color: var(--farbe-gold-hell);
      padding: 0.35rem 0.75rem;
      font-size: 0.72rem;
      font-family: 'Cinzel', serif;
      cursor: pointer;
      border-radius: 2px;
      transition: all 0.2s;
    }

    .datei-export-taste:hover {
      background: rgba(212,175,55,0.15);
      border-color: var(--farbe-gold-haupt);
    }

    /* MONUMENT / EINZELDOSSIER */
    .titulus-monument {
      background: linear-gradient(135deg, #202228 0%, #101115 100%);
      border: 2px solid var(--farbe-gold-dunkel);
      box-shadow: 0 15px 45px rgba(0,0,0,0.8), inset 0 0 100px rgba(0,0,0,0.6);
      border-radius: 4px;
      padding: 2.5rem 2rem;
      position: relative;
    }

    .titulus-monument::before {
      content: "DECRETO CENSORIO · CIVITAS ROMANA";
      position: absolute;
      top: -11px;
      left: 50%;
      transform: translateX(-50%);
      background: #4a1320;
      color: var(--farbe-gold-hell);
      font-family: 'Cinzel', serif;
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.3em;
      padding: 0.2rem 1.4rem;
      border: 1px solid var(--farbe-gold-haupt);
    }

    .titulus-kopf {
      text-align: center;
      margin-bottom: 2rem;
    }

    .titulus-inschrift {
      font-family: 'Cinzel', serif;
      font-size: clamp(1.4rem, 3.2vw, 2.4rem);
      font-weight: 700;
      letter-spacing: 0.2em;
      color: #fff;
      text-shadow: var(--meissel-schatten);
      margin-bottom: 0.5rem;
      word-break: break-word;
    }

    .titulus-phonetik {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.25rem;
      color: var(--farbe-gold-hell);
      font-style: italic;
    }

    .abzeichen-leiste {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.6rem;
      margin-top: 1rem;
    }

    .status-abzeichen {
      font-family: 'Cinzel', serif;
      font-size: 0.68rem;
      letter-spacing: 0.08em;
      padding: 0.25rem 0.75rem;
      border-radius: 2px;
      text-transform: uppercase;
      font-weight: 600;
    }

    .abzeichen-patrizier { background: var(--stand-patrizier-hg); border: 1px solid var(--stand-patrizier-linie); color: var(--stand-patrizier-text); }
    .abzeichen-ritter { background: var(--stand-ritter-hg); border: 1px solid var(--stand-ritter-linie); color: var(--stand-ritter-text); }
    .abzeichen-plebejer { background: var(--stand-plebejer-hg); border: 1px solid var(--stand-plebejer-linie); color: var(--stand-plebejer-text); }
    .abzeichen-freigelassener { background: var(--stand-freigelassener-hg); border: 1px solid var(--stand-freigelassener-linie); color: var(--stand-freigelassener-text); }
    .abzeichen-provinzial { background: var(--stand-provinzial-hg); border: 1px solid var(--stand-provinzial-linie); color: var(--stand-provinzial-text); }

    .abzeichen-rustica { background: var(--tribus-rustica-hg); border: 1px solid var(--tribus-rustica-linie); color: var(--tribus-rustica-text); }
    .abzeichen-urbana { background: var(--tribus-urbana-hg); border: 1px solid var(--tribus-urbana-linie); color: var(--tribus-urbana-text); }
    .abzeichen-epoche { background: rgba(255,255,255,0.06); border: 1px solid #4a4e59; color: #d0d3dc; }

    /* ANATOMIE-KASTEN (STANDARDIISIERT DREISTUFIG) */
    .anatomie-kasten-gitter {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 0.9rem;
      margin-top: 2rem;
    }

    .anatomie-kasten {
      background: rgba(9, 10, 13, 0.8);
      border: 1px solid var(--farbe-trennlinie);
      border-radius: 3px;
      padding: 0.9rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      transition: all 0.2s;
    }

    .anatomie-kasten:hover {
      border-color: var(--farbe-gold-dunkel);
      background: rgba(15, 17, 22, 0.95);
    }

    .kasten-patrizier { border-left: 3px solid var(--stand-patrizier-linie); }
    .kasten-ritter { border-left: 3px solid var(--stand-ritter-linie); }
    .kasten-plebejer { border-left: 3px solid var(--stand-plebejer-linie); }
    .kasten-freigelassener { border-left: 3px solid var(--stand-freigelassener-linie); }
    .kasten-provinzial { border-left: 3px solid var(--stand-provinzial-linie); }

    .kasten-rustica { border-left: 3px solid var(--tribus-rustica-linie); }
    .kasten-urbana { border-left: 3px solid var(--tribus-urbana-linie); }
    .kasten-neutral { border-left: 3px solid var(--farbe-gold-dunkel); }

    .kasten-stufe-kategorie {
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--farbe-gold-haupt);
    }

    .kasten-stufe-wert {
      font-family: 'Cinzel', serif;
      font-size: 1.15rem;
      font-weight: 700;
      color: #fff;
      letter-spacing: 0.05em;
    }

    .kasten-stufe-erklaerung {
      font-size: 0.78rem;
      color: var(--text-gedaempft);
      line-height: 1.4;
      margin-top: auto;
    }

    .kasten-stufe-erklaerung strong {
      color: #dfdbd1;
    }

    /* ZENSUS-ROLLE (MEHRFACH-GENERIERUNG) */
    .zensus-rolle {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .rolle-eintrag {
      background: var(--farbe-hintergrund-stein);
      border: 1px solid var(--farbe-trennlinie);
      border-left: 4px solid var(--farbe-gold-haupt);
      border-radius: 3px;
      padding: 1.25rem 1.4rem;
      transition: all 0.2s;
    }

    .rolle-eintrag:hover {
      border-color: var(--farbe-gold-haupt);
      transform: translateX(3px);
    }

    .rolle-kopf {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .rolle-name-gross {
      font-family: 'Cinzel', serif;
      font-size: 1.25rem;
      font-weight: 700;
      color: #fff;
      letter-spacing: 0.06em;
    }

    .rolle-name-sub {
      font-family: 'Cinzel', serif;
      font-size: 0.8rem;
      color: var(--farbe-gold-haupt);
      letter-spacing: 0.15em;
      margin-top: 0.2rem;
    }

    .rolle-detail-gitter {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 0.75rem;
      margin-top: 0.9rem;
      padding-top: 0.8rem;
      border-top: 1px solid rgba(255,255,255,0.05);
      font-size: 0.8rem;
    }

    .rolle-detail-element span {
      color: var(--farbe-gold-haupt);
      font-weight: 600;
      text-transform: uppercase;
      font-size: 0.7rem;
      display: block;
    }

    /* MODAL: LEXICON ONOMASTICUM */
    .modal-hintergrund {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.88);
      backdrop-filter: blur(8px);
      z-index: 2000;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .modal-hintergrund.aktiv {
      display: flex;
    }

    .modal-fenster {
      background: #13151b;
      border: 1px solid var(--farbe-gold-haupt);
      border-radius: 4px;
      width: 100%;
      max-width: 1200px;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 25px 70px rgba(0,0,0,0.95);
    }

    .modal-kopf {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.25rem 1.6rem;
      border-bottom: 1px solid var(--farbe-trennlinie);
      background: #0f1115;
    }

    .modal-kopf h2 {
      font-family: 'Cinzel', serif;
      font-size: 1.2rem;
      letter-spacing: 0.12em;
      color: var(--farbe-gold-hell);
    }

    .taste-schliessen {
      background: transparent;
      border: none;
      color: var(--text-gedaempft);
      font-size: 1.6rem;
      cursor: pointer;
      line-height: 1;
    }

    .taste-schliessen:hover { color: #fff; }

    .modal-reiter-leiste {
      display: flex;
      gap: 0.5rem;
      padding: 0.8rem 1.6rem;
      background: #0c0d11;
      border-bottom: 1px solid var(--farbe-trennlinie);
      overflow-x: auto;
    }

    .modal-reiter {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-gedaempft);
      font-family: 'Cinzel', serif;
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      padding: 0.45rem 0.85rem;
      cursor: pointer;
      border-radius: 2px;
      white-space: nowrap;
    }

    .modal-reiter.aktiv {
      background: rgba(212,175,55,0.15);
      border-color: var(--farbe-gold-haupt);
      color: var(--farbe-gold-hell);
      font-weight: 700;
    }

    .modal-suchleiste {
      padding: 0.8rem 1.6rem;
      background: #0f1115;
      border-bottom: 1px solid var(--farbe-trennlinie);
    }

    .modal-inhalt-bereich {
      padding: 1.6rem;
      overflow-y: auto;
      flex: 1;
    }

    /* LEXIKON-TABELLEN (STILREIN & HOCHAUFLÖSEND) */
    .lexikon-tabelle {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      font-size: 0.84rem;
      text-align: left;
    }

    .lexikon-tabelle th {
      font-family: 'Cinzel', serif;
      font-size: 0.72rem;
      letter-spacing: 0.1em;
      color: var(--farbe-gold-haupt);
      padding: 0.85rem 1rem;
      border-bottom: 2px solid var(--farbe-gold-dunkel);
      background: #111317;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .lexikon-tabelle td {
      padding: 0.75rem 1rem;
      border-bottom: 1px solid #252833;
      color: #d1ccbe;
      vertical-align: top;
      line-height: 1.45;
    }

    .lexikon-tabelle tbody tr:hover td {
      background: rgba(255,255,255,0.04);
    }
  </style>
</head>
<body>

<div class="haupt-rahmen">
  <header>
    <div class="spqr-banderole">Tabularium Gentium Romanarum</div>
    <h1>ARCHIVVM · NOMINVM</h1>
    <div class="untertitel">Wissenschaftlich-authentischer Generator des antiken römischen Bürgerrechts & der Tria Nomina</div>
  </header>

  <div class="register-anordnung">
    
    <!-- KONTROLLDECK -->
    <aside class="steuerpult">
      <div class="steuerpult-titel">
        <span>Senatus Consultum</span>
        <span style="font-size:0.75rem; opacity:0.6;">S·P·Q·R</span>
      </div>

      <!-- Epoche -->
      <div class="eingabe-gruppe">
        <label for="cfgEpoche">
          Aetas Historica · Historische Epoche
          <span class="label-untertitel">Rechtsepoche</span>
        </label>
        <select id="cfgEpoche">
          <option value="late_rep" selected>Aetas Libera · Späte Republik (Klassische Tria Nomina)</option>
          <option value="early_rep">Aetas Antiqua · Frühe Republik (Archaisches Bürgerrecht)</option>
          <option value="principate">Aetas Principatus · Hohe Kaiserzeit (Polyonymie & Adoptionen)</option>
          <option value="late_antiquity">Aetas Posterior · Spätantike (Signa & Amtspräfixe)</option>
        </select>
      </div>

      <!-- Gesellschaftlicher Stand -->
      <div class="eingabe-gruppe">
        <label for="cfgStand">
          Status Civitatis · Gesellschaftlicher Stand
          <span class="label-untertitel">Ordo</span>
        </label>
        <select id="cfgStand">

  let archivAktuell = [];

  function nachMonumental(str) {
    if (!str) return "";
    return str
      .toUpperCase()
      .replace(/U/g, 'V')
      .replace(/J/g, 'I')
      .replace(/\s+/g, '·')
      .replace(/·+/g, '·')
      .replace(/^·|·$/g, '');
  }

  function synthetisiereBuerger(konfiguration) {
    const epoche = konfiguration.epoche;
    const stand = konfiguration.stand;
    const geschlecht = konfiguration.geschlecht;
    const agnomenModus = konfiguration.agnomenModus;
    const festeGens = konfiguration.festeGens;

    // 1. Gens bestimmen
    let gensObj = null;
    if (festeGens) {
      gensObj = GENTES_DB.find(g => g.nomen.toLowerCase() === festeGens.toLowerCase());
      if (!gensObj) {
        gensObj = {
          nomen: festeGens,
          status: stand === 'patrician' ? 'Patricius · Patrizier' : (stand === 'equester' ? 'Equester · Ritterstand' : 'Plebeius · Plebejer'),
          time: "historisch bezeugt",
          stirpes: "—",
          origin: "Selbstständige Bürger-Gens aus römischem Siedlungsgebiet."
        };
      }
    } else {
      if (stand === 'patrician') {
        const patGentes = GENTES_DB.filter(g => g.status.includes('Patricius'));
        gensObj = zufall(patGentes);
      } else if (stand === 'equester') {
        const ritterGentes = GENTES_DB.filter(g => g.status.includes('Equester'));
        gensObj = ritterGentes.length ? zufall(ritterGentes) : zufall(GENTES_DB);
      } else if (stand === 'provincialis') {
        // Provinzialen übernahmen oft Kaisernamen (Iulius, Claudius, Flavius, Aurelius)
        const provGentes = GENTES_DB.filter(g => ["Iulius", "Claudius", "Flavius", "Aurelius", "Ulpius"].includes(g.nomen));
        gensObj = provGentes.length ? zufall(provGentes) : zufall(GENTES_DB);
      } else {
        const plebGentes = GENTES_DB.filter(g => g.status.includes('Plebeius'));
        gensObj = zufall(plebGentes);
      }
    }

    // Nomen anpassen (Feminin)
    let nomenText = (geschlecht === 'M') ? gensObj.nomen : gensObj.nomen.replace(/us$/, 'a').replace(/ius$/, 'ia');

    // 2. Praenomen & Filiation
    let praenomenObj = zufall(PRAENOMINA_DB);
    let vaterPraenomen = zufall(PRAENOMINA_DB);
    let praenomenText = "";
    let praenomenKuerzel = "";
    let filiationText = "";
    let filiationBedeutung = "";

    if (geschlecht === 'M') {
      if (epoche === 'late_antiquity') {
        praenomenText = "Flavius";
        praenomenKuerzel = "Fl.";
        filiationText = "";
        filiationBedeutung = "In der Spätantike erlosch die Filiation; 'Flavius' galt als erhabenes Amtspräfix";
      } else {
        praenomenText = praenomenObj.name;
        praenomenKuerzel = praenomenObj.abbr;

        if (stand === 'libertus') {
          filiationText = `${vaterPraenomen.abbr} l.`;
          filiationBedeutung = `Freigelassener (libertus) des Patrons ${vaterPraenomen.name}`;
        } else {
          filiationText = `${vaterPraenomen.abbr} f.`;
          filiationBedeutung = `Rechtmäßiger Sohn (filius) des Bürgers ${vaterPraenomen.name}`;
        }
      }
    } else {
      // Römische Frauen führten in der Republik kein Praenomen
      praenomenText = "";
      praenomenKuerzel = "";
      if (stand === 'libertus') {
        filiationText = `${vaterPraenomen.abbr} l.`;
        filiationBedeutung = `Freigelassene (liberta) des Patrons ${vaterPraenomen.name}`;
      } else {
        filiationText = `${vaterPraenomen.abbr} f.`;
        filiationBedeutung = `Rechtmäßige Tochter (filia) des Bürgers ${vaterPraenomen.name}`;
      }
    }

    // 3. Tribus
    let tribusObj = null;
    if (stand === 'libertus') {
      const stadtTribus = TRIBUS_DB.filter(t => t.type.includes('urbana'));
      tribusObj = zufall(stadtTribus);
    } else if (stand === 'patrician') {
      const patTribus = TRIBUS_DB.filter(t => t.stand === 'patrician');
      tribusObj = zufall(patTribus);
    } else {
      tribusObj = zufall(TRIBUS_DB);
    }

    let tribusText = (epoche !== 'early_rep' && epoche !== 'late_antiquity' && geschlecht === 'M') ? tribusObj.abbr : "";

    // 4. Cognomen
    let cognomenObj = null;
    let cognomenText = "";

    if (stand === 'libertus') {
      cognomenObj = zufall(LIBERTI_COGNOMINA_DB);
      cognomenText = (geschlecht === 'M') ? cognomenObj.name : cognomenObj.fem;
    } else {
      cognomenObj = zufall(COGNOMINA_DB);
      if (geschlecht === 'F') {
        cognomenText = (Math.random() > 0.5) ? cognomenObj.fem : zufall(["Maior", "Minor", "Tertia", "Drusilla"]);
      } else {
        cognomenText = cognomenObj.name;
      }
    }

    if (epoche === 'early_rep') {
      if (stand !== 'patrician' || Math.random() > 0.4) {
        cognomenText = "";
      }
    }

    // 5. Agnomen (Regel: Niemals bei Frauen)
    let agnomenObj = null;
    let agnomenText = "";

    if (geschlecht === 'M') {
      if (agnomenModus === 'immer') {
        agnomenObj = zufall(AGNOMINA_DB);
        agnomenText = agnomenObj.title;
      } else if (agnomenModus === 'zufall') {
        // Bei Zufall: ca. 30% Wahrscheinlichkeit bei Patriziern und Rittern, sonst 10%
        const schwelle = (stand === 'patrician' || stand === 'equester') ? 0.70 : 0.90;
        if (Math.random() > schwelle && epoche !== 'early_rep') {
          agnomenObj = zufall(AGNOMINA_DB);
          agnomenText = agnomenObj.title;
        }
      }
      // 'nie' -> agnomenText bleibt leer
    }

    return {
      praenomen: praenomenText,
      praenomenKuerzel: praenomenKuerzel,
      praenomenBedeutung: praenomenObj.meaning,
      nomen: nomenText,
      gensMasc: gensObj.nomen,
      gensStatus: gensObj.status,
      gensEpoche: gensObj.time,
      gensHerkunft: gensObj.origin,
      gensStirpes: gensObj.stirpes,
      filiation: filiationText,
      filiationBedeutung: filiationBedeutung,
      tribus: tribusText,
      tribusObj: tribusObj,
      cognomen: cognomenText,
      cognomenBedeutung: cognomenObj ? cognomenObj.meaning : "Kein Sippenzweig deklariert",
      cognomenHerkunft: cognomenObj ? (cognomenObj.origin || "Altrömische Charakterisierung") : "",
      agnomen: agnomenText,
      agnomenGrund: agnomenObj ? agnomenObj.reason : "",
      geschlecht: geschlecht,
      epoche: epoche,
      stand: stand
    };
  }

  // =========================================================================
  // 3. ANZEIGE- UND RENDERING-LOGIK (MIT LIVE-UMSCHALTUNG)
  // =========================================================================

  const ausgabeFlaeche = document.getElementById('ausgabeFlaeche');
  const statusZensus = document.getElementById('statusZensus');

  function standKlasse(standText) {
    if (standText.includes('Patricius')) return { kasten: 'kasten-patrizier', abzeichen: 'abzeichen-patrizier' };
    if (standText.includes('Equester')) return { kasten: 'kasten-ritter', abzeichen: 'abzeichen-ritter' };
    if (standText.includes('Plebeius')) return { kasten: 'kasten-plebejer', abzeichen: 'abzeichen-plebejer' };
    if (standText.includes('Libertus')) return { kasten: 'kasten-freigelassener', abzeichen: 'abzeichen-freigelassener' };
    return { kasten: 'kasten-provinzial', abzeichen: 'abzeichen-provinzial' };
  }

  function formatiereEpoche(ep) {
    switch(ep) {
      case 'early_rep': return 'Aetas Antiqua · Frühe Republik';
      case 'late_rep': return 'Aetas Libera · Späte Republik';
      case 'principate': return 'Aetas Principatus · Hohe Kaiserzeit';
      case 'late_antiquity': return 'Aetas Posterior · Spätantike';
      default: return ep;
    }
  }

  function rendereAusgabe() {
    if (!archivAktuell.length) {
      ausgabeFlaeche.innerHTML = `<div style="text-align:center; padding:4rem; color:var(--text-gedaempft); font-style:italic;">Keine Bürger im Zensus verzeichnet. Wähle die Parameter und befehle die Beurkundung.</div>`;
      statusZensus.textContent = "Zensus: Keine Eintragung";
      return;
    }

    const schriftModus = document.getElementById('cfgSchrift').value;
    statusZensus.textContent = `Zensus: ${archivAktuell.length} ${archivAktuell.length === 1 ? 'Bürgerdossier' : 'Eintragungen in der Rolle'}`;

    // A: EINZEL-DOSSIER
    if (archivAktuell.length === 1) {
      const c = archivAktuell[0];

      const teileKlassisch = [c.praenomen, c.nomen, c.filiation, c.tribus, c.cognomen, c.agnomen].filter(Boolean).join(' ');
      const teileMonumental = [c.praenomenKuerzel || c.praenomen, c.nomen, c.filiation, c.tribus, c.cognomen, c.agnomen].filter(Boolean).join(' ');
      const inschriftAnzeige = (schriftModus === 'monumental') ? nachMonumental(teileMonumental) : teileKlassisch;

      const sk = standKlasse(c.gensStatus);
      const istRustica = c.tribusObj && c.tribusObj.type.includes('rustica');
      const tribusKastenKlasse = istRustica ? 'kasten-rustica' : 'kasten-urbana';
      const tribusAbzeichenKlasse = istRustica ? 'abzeichen-rustica' : 'abzeichen-urbana';

      ausgabeFlaeche.innerHTML = `
        <div class="titulus-monument">
          <div class="titulus-kopf">
            <div class="titulus-inschrift">${inschriftAnzeige}</div>
            <div class="titulus-phonetik">Klassisches Buchlatein: ${teileKlassisch}</div>
            <div class="abzeichen-leiste">
              <span class="status-abzeichen ${sk.abzeichen}">Status: ${c.gensStatus}</span>
              <span class="status-abzeichen ${tribusAbzeichenKlasse}">${c.tribus ? `Tribus ${c.tribusObj.name} (${c.tribusObj.type})` : 'Tribus: Exemt'}</span>
              <span class="status-abzeichen abzeichen-epoche">Aetas: ${formatiereEpoche(c.epoche)}</span>
              <span class="status-abzeichen abzeichen-epoche">${c.geschlecht === 'M' ? '♂ Vir Civis' : '♀ Femina Matrona'}</span>
            </div>
          </div>

          <!-- STANDARDIISIERTE 3-STUFIGE KASTEN (LATEIN / DEUTSCH) -->
          <div class="anatomie-kasten-gitter">
            
            <!-- Kasten 1: Praenomen -->
            <div class="anatomie-kasten kasten-neutral">
              <div class="kasten-stufe-kategorie">Praenomen · Vorname</div>
              <div class="kasten-stufe-wert">${c.praenomen || '—'}</div>
              <div class="kasten-stufe-erklaerung">
                ${c.praenomen 
                  ? `<strong>Bedeutung:</strong> ${c.praenomenBedeutung}. Epigraphisches Siegel: <strong>${c.praenomenKuerzel}</strong>.`
                  : `<strong>Historischer Status:</strong> Römische Bürgerinnen führten in der Republik kein Praenomen, sondern den Sippennamen.`
                }
              </div>
            </div>

            <!-- Kasten 2: Nomen Gentile -->
            <div class="anatomie-kasten ${sk.kasten}">
              <div class="kasten-stufe-kategorie">Nomen Gentile · Sippenname</div>
              <div class="kasten-stufe-wert">${c.nomen}</div>
              <div class="kasten-stufe-erklaerung">
                <strong>Gens ${c.gensMasc}:</strong> ${c.gensHerkunft} 
                <br><em>Zweige (Stirpes):</em> ${c.gensStirpes}. Bezeugt: ${c.gensEpoche}.
              </div>
            </div>

            <!-- Kasten 3: Filiatio -->
            <div class="anatomie-kasten kasten-neutral">
              <div class="kasten-stufe-kategorie">Filiatio · Abstammung</div>
              <div class="kasten-stufe-wert">${c.filiation || '—'}</div>
              <div class="kasten-stufe-erklaerung">
                <strong>Rechtsformel:</strong> ${c.filiationBedeutung || 'Keine Abstammung deklariert'}.
              </div>
            </div>

            <!-- Kasten 4: Tribus -->
            <div class="anatomie-kasten ${tribusKastenKlasse}">
              <div class="kasten-stufe-kategorie">Tribus · Bürger-Stimmbezirk</div>
              <div class="kasten-stufe-wert">${c.tribus ? `${c.tribusObj.abbr} (${c.tribusObj.name})` : '—'}</div>
              <div class="kasten-stufe-erklaerung">
                ${c.tribus 
                  ? `<strong>Bezirk (${c.tribusObj.type}):</strong> ${c.tribusObj.region}. Grundlegend für das Stimmrecht in den Comitia Tributa.`
                  : `Frauen und Nicht-Stimmberechtigte führten keine formelle Tribus-Eintragung.`
                }
              </div>
            </div>

            <!-- Kasten 5: Cognomen -->
            <div class="anatomie-kasten kasten-neutral">
              <div class="kasten-stufe-kategorie">Cognomen · Sippenzweig</div>
              <div class="kasten-stufe-wert">${c.cognomen || '—'}</div>
              <div class="kasten-stufe-erklaerung">
                <strong>Charakterisierung:</strong> ${c.cognomenBedeutung}. 
                <br><em>Kontext:</em> ${c.cognomenHerkunft}.
              </div>
            </div>

            ${c.agnomen ? `
            <!-- Kasten 6: Agnomen -->
            <div class="anatomie-kasten" style="border-left: 3px solid var(--farbe-gold-hell);">
              <div class="kasten-stufe-kategorie" style="color: var(--farbe-gold-hell);">Agnomen · Ehrenbeiname</div>
              <div class="kasten-stufe-wert" style="color: var(--farbe-gold-hell);">${c.agnomen}</div>
              <div class="kasten-stufe-erklaerung">
                <strong>Senats-Dekret:</strong> ${c.agnomenGrund}.
              </div>
            </div>` : ''}

          </div>
        </div>
      `;
      return;
    }

    // B: MEHRFACH-ROLLE (BIS ZU 100 NAMEN)
    const rolle = document.createElement('div');
    rolle.className = 'zensus-rolle';

    archivAktuell.forEach((c) => {
      const teileCls = [c.praenomen, c.nomen, c.filiation, c.tribus, c.cognomen, c.agnomen].filter(Boolean).join(' ');
      const teileMon = [c.praenomenKuerzel || c.praenomen, c.nomen, c.filiation, c.tribus, c.cognomen, c.agnomen].filter(Boolean).join(' ');
      const titelText = (schriftModus === 'monumental') ? nachMonumental(teileMon) : teileCls;

      const sk = standKlasse(c.gensStatus);
      const istRust = c.tribusObj && c.tribusObj.type.includes('rustica');

      const eintrag = document.createElement('div');
      eintrag.className = 'rolle-eintrag';
      eintrag.innerHTML = `
        <div class="rolle-kopf">
          <div>
            <div class="rolle-name-gross">${titelText}</div>
            <div class="rolle-name-sub">Klassisch: ${teileCls}</div>
          </div>
          <div class="abzeichen-leiste" style="margin:0;">
            <span class="status-abzeichen ${sk.abzeichen}">${c.gensStatus}</span>
            <span class="status-abzeichen ${istRust ? 'abzeichen-rustica' : 'abzeichen-urbana'}">${c.tribus ? `Tribus ${c.tribusObj.name}` : 'Sine Tribu'}</span>
          </div>
        </div>
        <div class="rolle-detail-gitter">
          <div class="rolle-detail-element">
            <span>Gens · Familie</span>
            ${c.nomen} (${c.gensHerkunft})
          </div>
          <div class="rolle-detail-element">
            <span>Filiatio · Abstammung</span>
            ${c.filiation || '—'} · ${c.filiationBedeutung}
          </div>
          <div class="rolle-detail-element">
            <span>Cognomen · Bedeutung</span>
            ${c.cognomen || '—'} (${c.cognomenBedeutung})
          </div>
          ${c.agnomen ? `
          <div class="rolle-detail-element">
            <span>Agnomen · Ehrentitel</span>
            ${c.agnomen} (${c.agnomenGrund})
          </div>` : ''}
        </div>
      `;
      rolle.appendChild(eintrag);
    });

    ausgabeFlaeche.innerHTML = '';
    ausgabeFlaeche.appendChild(rolle);
  }

  // =========================================================================
  // 4. GENERIERUNGSAUSFÜHRUNG & EREIGNISSE
  // =========================================================================

  function fuehreGenerierungAus() {
    const musterSchluessel = document.getElementById('cfgMusterPerson').value;

    if (musterSchluessel && FAMOUS_PRESETS[musterSchluessel]) {
      const p = FAMOUS_PRESETS[musterSchluessel];
      const gObj = GENTES_DB.find(g => g.nomen === p.nomen) || { status: p.social === 'patrician' ? 'Patricius · Patrizier' : 'Plebeius · Plebejer', time: "bezeugt", stirpes: p.cognomen, origin: "Bedeutende Gens Roms" };
      const tObj = TRIBUS_DB.find(t => t.abbr === p.tribus) || { abbr: p.tribus, name: p.tribus, type: "rustica · ländlich", region: "Latium" };
      const cObj = COGNOMINA_DB.find(c => c.name === p.cognomen) || { meaning: "Historischer Beiname", origin: "Historische Überlieferung" };
      const aObj = AGNOMINA_DB.find(a => a.title === p.agnomen) || { reason: "Historischer Siegestitel" };

      const musterBuerger = {
        praenomen: p.praenomen,
        praenomenKuerzel: p.praenomen ? p.praenomen.slice(0, 1) + '.' : '',
        praenomenBedeutung: "Historischer Vorname",
        nomen: p.nomen,
        gensMasc: p.nomen,
        gensStatus: gObj.status,
        gensEpoche: gObj.time,
        gensHerkunft: p.desc,
        gensStirpes: gObj.stirpes,
        filiation: p.filiation,
        filiationBedeutung: "In antiken Fasti belegte Vaterschaft",
        tribus: p.tribus,
        tribusObj: tObj,
        cognomen: p.cognomen,
        cognomenBedeutung: cObj.meaning,
        cognomenHerkunft: cObj.origin,
        agnomen: p.agnomen,
        agnomenGrund: aObj.reason,
        geschlecht: p.gender,
        epoche: p.epoch,
        stand: p.social
      };

      archivAktuell = [musterBuerger];
      rendereAusgabe();
      return;
    }

    let anzahl = parseInt(document.getElementById('cfgAnzahl').value, 10);
    if (isNaN(anzahl) || anzahl < 1) anzahl = 1;
    if (anzahl > 100) anzahl = 100;

    const konfig = {
      epoche: document.getElementById('cfgEpoche').value,
      stand: document.getElementById('cfgStand').value,
      geschlecht: document.querySelector('input[name="cfgGeschlecht"]:checked').value,
      agnomenModus: document.getElementById('cfgAgnomenModus').value,
      festeGens: document.getElementById('cfgGensEingabe').value.trim()
    };

    const ergebnisse = [];
    for (let i = 0; i < anzahl; i++) {
      ergebnisse.push(synthetisiereBuerger(konfig));
    }

    archivAktuell = ergebnisse;
    rendereAusgabe();
  }

  // LIVE-UMWANDLUNG DER SCHRIFT BEIM ÄNDERN DES SCHALTERS
  document.getElementById('cfgSchrift').addEventListener('change', () => {
    if (archivAktuell.length > 0) {
      rendereAusgabe();
    }
  });

  document.getElementById('btnGenerieren').addEventListener('click', () => {
    document.getElementById('cfgMusterPerson').value = "";
    fuehreGenerierungAus();
  });

  document.getElementById('cfgMusterPerson').addEventListener('change', (e) => {
    if (e.target.value) {
      document.getElementById('cfgAnzahl').value = 1;
      fuehreGenerierungAus();
    }
  });

  document.getElementById('btnRuecksetzen').addEventListener('click', () => {
    document.getElementById('cfgEpoche').value = 'late_rep';
    document.getElementById('cfgStand').value = 'patrician';
    document.getElementById('geschlechtM').checked = true;
    document.getElementById('cfgAnzahl').value = 1;
    document.getElementById('cfgAgnomenModus').value = 'zufall';
    document.getElementById('cfgSchrift').value = 'monumental';
    document.getElementById('cfgGensEingabe').value = '';
    document.getElementById('cfgMusterPerson').value = '';
    fuehreGenerierungAus();
  });

  document.getElementById('btnZufall').addEventListener('click', () => {
    document.getElementById('cfgEpoche').value = zufall(['early_rep', 'late_rep', 'principate', 'late_antiquity']);
    document.getElementById('cfgStand').value = zufall(['patrician', 'equester', 'plebeian', 'libertus', 'provincialis']);
    if (Math.random() > 0.5) document.getElementById('geschlechtF').checked = true;
    else document.getElementById('geschlechtM').checked = true;
    document.getElementById('cfgGensEingabe').value = '';
    document.getElementById('cfgMusterPerson').value = '';
    fuehreGenerierungAus();
  });

  // =========================================================================
  // 5. EXPORT (JSON & CSV)
  // =========================================================================

  document.getElementById('btnExportJSON').addEventListener('click', () => {
    if (!archivAktuell.length) return;
    const datenString = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(archivAktuell, null, 2));
    const dlAnker = document.createElement('a');
    dlAnker.setAttribute("href", datenString);
    dlAnker.setAttribute("download", "zensus_romanus_archiv.json");
    dlAnker.click();
  });

  document.getElementById('btnExportCSV').addEventListener('click', () => {
    if (!archivAktuell.length) return;
    let csv = "Praenomen;Nomen_Gentile;Filiatio;Tribus;Cognomen;Agnomen;Status_Civitatis;Aetas_Historica;Nomen_Latinum;Titulus_Monumentalis\n";
    archivAktuell.forEach(c => {
      const cls = [c.praenomen, c.nomen, c.filiation, c.tribus, c.cognomen, c.agnomen].filter(Boolean).join(' ');
      const mon = nachMonumental([c.praenomenKuerzel || c.praenomen, c.nomen, c.filiation, c.tribus, c.cognomen, c.agnomen].filter(Boolean).join(' '));
      csv += `"${c.praenomen}";"${c.nomen}";"${c.filiation}";"${c.tribus}";"${c.cognomen}";"${c.agnomen}";"${c.gensStatus}";"${c.epoche}";"${cls}";"${mon}"\n`;
    });
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const dlAnker = document.createElement('a');
    dlAnker.setAttribute("href", URL.createObjectURL(blob));
    dlAnker.setAttribute("download", "zensus_romanus_rolle.csv");
    dlAnker.click();
  });

  // =========================================================================
  // 6. LEXICON ONOMASTICUM (MODAL & KATALOG)
  // =========================================================================

  const modal = document.getElementById('lexikonModal');
  const btnLexikonOeffnen = document.getElementById('btnLexikonOeffnen');
  const btnLexikonSchliessen = document.getElementById('btnLexikonSchliessen');
  const lexikonTabellenAnzeige = document.getElementById('lexikonTabellenAnzeige');
  const lexikonSuchFeld = document.getElementById('lexikonSuchFeld');
  const reiterTasten = document.querySelectorAll('.modal-reiter');

  let aktiverKatalog = 'gentes';

  btnLexikonOeffnen.addEventListener('click', () => {
    modal.classList.add('aktiv');
    rendereKatalogTabelle();
  });

  btnLexikonSchliessen.addEventListener('click', () => {
    modal.classList.remove('aktiv');
  });

  modal.addEventListener('click', (e) => {
    if (e.target === modal) modal.classList.remove('aktiv');
  });

  reiterTasten.forEach(taste => {
    taste.addEventListener('click', () => {
      reiterTasten.forEach(t => t.classList.remove('aktiv'));
      taste.classList.add('aktiv');
      aktiverKatalog = taste.getAttribute('data-katalog');
      rendereKatalogTabelle();
    });
  });

  lexikonSuchFeld.addEventListener('input', () => {
    rendereKatalogTabelle();
  });

  function rendereKatalogTabelle() {
    const begriff = lexikonSuchFeld.value.toLowerCase().trim();
    let tabelleHtml = '';

    if (aktiverKatalog === 'gentes') {
      const gefiltert = GENTES_DB.filter(g => 
        g.nomen.toLowerCase().includes(begriff) || 
        g.status.toLowerCase().includes(begriff) || 
        g.origin.toLowerCase().includes(begriff) ||
        g.stirpes.toLowerCase().includes(begriff)
      );

      tabelleHtml = `
        <table class="lexikon-tabelle">
          <thead>
            <tr>
              <th style="width:20%;">Gens (Nomen)</th>
              <th style="width:20%;">Status Civitatis · Stand</th>
              <th style="width:15%;">Epoche</th>
              <th style="width:20%;">Stirpes · Hauptzweige</th>
              <th style="width:25%;">Historische Bedeutung</th>
            </tr>
          </thead>
          <tbody>
            ${gefiltert.map(g => {
              const sk = standKlasse(g.status);
              return `
              <tr>
                <td style="font-family:'Cinzel',serif; font-weight:700; color:#fff;">${g.nomen}</td>
                <td><span class="status-abzeichen ${sk.abzeichen}">${g.status}</span></td>
                <td>${g.time}</td>
                <td><em>${g.stirpes}</em></td>
                <td>${g.origin}</td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
      `;
    } else if (aktiverKatalog === 'cognomina') {
      const gefiltert = COGNOMINA_DB.filter(c => 
        c.name.toLowerCase().includes(begriff) || 
        c.meaning.toLowerCase().includes(begriff) || 
        c.origin.toLowerCase().includes(begriff)
      );

      tabelleHtml = `
        <table class="lexikon-tabelle">
          <thead>
            <tr>
              <th style="width:20%;">Cognomen</th>
              <th style="width:15%;">Femininum</th>
              <th style="width:35%;">Wörtliche Bedeutung & Übersetzung</th>
              <th style="width:30%;">Historischer Träger / Kontext</th>
            </tr>
          </thead>
          <tbody>
            ${gefiltert.map(c => `
              <tr>
                <td style="font-family:'Cinzel',serif; font-weight:700; color:#fff;">${c.name}</td>
                <td style="font-family:'Cinzel',serif; color:var(--farbe-gold-hell);">${c.fem}</td>
                <td>${c.meaning}</td>
                <td>${c.origin}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
    } else if (aktiverKatalog === 'agnomina') {
      const gefiltert = AGNOMINA_DB.filter(a => 
        a.title.toLowerCase().includes(begriff) || 
        a.reason.toLowerCase().includes(begriff)
      );

      tabelleHtml = `
        <table class="lexikon-tabelle">
          <thead>
            <tr>
              <th style="width:25%;">Agnomen · Ehrentitel</th>
              <th style="width:75%;">Anlass & Historischer Grund der Senatsverleihung</th>
            </tr>
          </thead>
          <tbody>
            ${gefiltert.map(a => `
              <tr>
                <td style="font-family:'Cinzel',serif; font-weight:700; color:var(--farbe-gold-hell);">${a.title}</td>
                <td>${a.reason}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
    } else if (aktiverKatalog === 'praenomina') {
      const gefiltert = PRAENOMINA_DB.filter(p => 
        p.name.toLowerCase().includes(begriff) || 
        p.abbr.toLowerCase().includes(begriff) || 
        p.meaning.toLowerCase().includes(begriff)
      );

      tabelleHtml = `
        <table class="lexikon-tabelle">
          <thead>
            <tr>
              <th style="width:20%;">Praenomen</th>
              <th style="width:15%;">Epigraphisches Siegel</th>
              <th style="width:20%;">Femininum</th>
              <th style="width:45%;">Etymologie & Bedeutung</th>
            </tr>
          </thead>
          <tbody>
            ${gefiltert.map(p => `
              <tr>
                <td style="font-family:'Cinzel',serif; font-weight:700; color:#fff;">${p.name}</td>
                <td style="font-family:'Cinzel',serif; font-weight:700; color:var(--farbe-gold-haupt);">${p.abbr}</td>
                <td>${p.fem}</td>
                <td>${p.meaning}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
    } else if (aktiverKatalog === 'tribus') {
      const gefiltert = TRIBUS_DB.filter(t => 
        t.name.toLowerCase().includes(begriff) || 
        t.abbr.toLowerCase().includes(begriff) || 
        t.region.toLowerCase().includes(begriff)
      );

      tabelleHtml = `
        <table class="lexikon-tabelle">
          <thead>
            <tr>
              <th style="width:15%;">Kürzel</th>
              <th style="width:25%;">Tribus (Stimmbezirk)</th>
              <th style="width:25%;">Typus</th>
              <th style="width:35%;">Geografische Lage & Territorium</th>
            </tr>
          </thead>
          <tbody>
            ${gefiltert.map(t => {
              const istRust = t.type.includes('rustica');
              return `
              <tr>
                <td style="font-family:'Cinzel',serif; font-weight:700; color:var(--farbe-gold-haupt);">${t.abbr}</td>
                <td style="font-family:'Cinzel',serif; font-weight:700; color:#fff;">${t.name}</td>
                <td><span class="status-abzeichen ${istRust ? 'abzeichen-rustica' : 'abzeichen-urbana'}">${t.type}</span></td>
                <td>${t.region}</td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
      `;
    }

    lexikonTabellenAnzeige.innerHTML = tabelleHtml;
  }

  // Initialer Start mit C. Iulius Caesar
  document.getElementById('cfgMusterPerson').value = "caesar";
  fuehreGenerierungAus();

})();
</script>
</body>
</html>
